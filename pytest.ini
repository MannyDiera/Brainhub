[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    critical: invariantes críticas del pipeline
    unit: pruebas unitarias rápidas y aisladas
    integration: pruebas entre módulos y persistencia temporal
    slow: pruebas lentas o dependientes de modelos
